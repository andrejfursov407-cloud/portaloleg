<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b3fd6">
<title>Вход: портал Олега Борисовского</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b3fd6'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='900' text-anchor='middle' fill='%23fff' font-family='Arial'%3E%D0%91%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css"></head>
<body><div class="auth"><form class="card" id="f" novalidate>
<div class="brand"><svg viewBox="0 0 80 80" aria-hidden="true"><g transform="rotate(-35 40 42)"><rect x="8" y="20" width="64" height="46" rx="5" fill="#fff" stroke="#c5d1f2" stroke-width="2"/><text x="14" y="46" font-size="24" font-weight="900" fill="#0b3fd6" font-family="Arial,sans-serif">Я</text><path d="M44 40c-8-5-11-9-11-13a5.5 5.5 0 0 1 11-2 5.5 5.5 0 0 1 11 2c0 4-3 8-11 13z" fill="#e3262e"/><text x="12" y="60" font-size="10.5" font-weight="900" fill="#0b3fd6" font-family="Arial,sans-serif">БОРИСОВКУ</text></g></svg><b>Олег<br>Борисовский</b></div>
<h1 id="h"></h1><p class="sub" id="s"></p>
<div id="nameRow"><label for="n">Имя</label><input id="n" autocomplete="name"></div>
<label for="e">Эл. почта</label><input id="e" type="email" autocomplete="email" inputmode="email" autocapitalize="off">
<label for="p">Пароль</label><input id="p" type="password">
<div id="p2Row"><label for="p2">Повторите пароль</label><input id="p2" type="password" autocomplete="new-password"></div>
<p class="err" id="err" role="alert"></p>
<button class="btn" id="go" type="submit"></button>
<p class="switch" id="swRow"><span id="swText"></span> <button type="button" class="link" id="sw"></button></p>
</form></div><script src="/static/login.js"></script></body></html>
