name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Синтаксис JavaScript
        run: npm run check
      - name: ShellCheck
        run: shellcheck -S error install.sh uninstall.sh tests/smoke.sh
      - name: Проверка работы сервера
        run: npm test
