# Настройки Ollama для сервера 6 ядер, 8 ГБ ОЗУ, без видеокарты
[Service]
# слушаем только локальный адрес, наружу порт не открывается
Environment="OLLAMA_HOST=127.0.0.1:11434"
# одна модель в памяти, один запрос за раз: экономит оперативную память
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_NUM_PARALLEL=1"
# держать модель в памяти 30 минут после последнего вопроса (быстрый ответ)
Environment="OLLAMA_KEEP_ALIVE=30m"
